{% extends 'base.html' %}{% block title %}Create your account · TicketTrust{% endblock %}{% block content %}<div class="max-w-xl mx-auto px-5 py-12"><p class="text-green text-sm font-bold uppercase tracking-widest">Join TicketTrust</p><h1 class="display text-4xl font-bold mt-3">Sell with confidence.</h1><p class="text-slate-500 mt-3">Your email is verified with a one-time code before you can access your dashboard.</p><form method="post" class="bg-white border border-slate-200 rounded-3xl p-7 mt-8">{% csrf_token %}<label class="text-sm font-semibold">Full name<input required name="name" class="field"></label><label class="block text-sm font-semibold mt-4">Email<input required type="email" name="email" class="field"></label><label class="block text-sm font-semibold mt-4">Phone number<input required name="phone" class="field" placeholder="080..."></label><label class="block text-sm font-semibold mt-4">Social media link <span class="font-normal text-slate-400">(helps build trust)</span><input type="url" name="social_link" class="field" placeholder="https://instagram.com/..."></label><label class="block text-sm font-semibold mt-4">Password<input required type="password" minlength="8" name="password" class="field"></label><button class="mt-7 w-full bg-ink text-white rounded-full py-3.5 font-bold">Create account ↗</button></form></div><style>.field{display:block;width:100%;margin-top:.45rem;border:1px solid #e2e8f0;border-radius:.9rem;padding:.75rem .9rem;outline:none}.field:focus{border-color:#0e6b4c}</style>{% endblock %}
