<form method="post" class="bg-white border border-slate-200 rounded-3xl p-7 mt-5">{% csrf_token %}<label class="text-sm font-semibold">Bank<select required name="bank_code" class="field">{% for bank in banks %}<option value="{{ bank.code }}"{% if account and account.bank_code == bank.code %} selected{% endif %}>{{ bank.name }} · {{ bank.code }}</option>{% endfor %}</select></label><label class="block text-sm font-semibold mt-4">Account number<input required name="account_number" pattern="[0-9]{10}" maxlength="10" value="{% if account %}{{ account.account_number }}{% endif %}" class="field"></label><label class="block text-sm font-semibold mt-4">Account name <span class="font-normal text-slate-400">(used as a fallback; Bachs resolves the real name)</span><input name="account_name" value="{% if account %}{{ account.account_name }}{% endif %}" class="field"></label><button class="mt-7 w-full bg-ink text-white rounded-full py-3 font-bold">Verify and save account</button></form><style>.field{display:block;width:100%;margin-top:.45rem;border:1px solid #e2e8f0;border-radius:.9rem;padding:.75rem .9rem;outline:none;background:white}.field:focus{border-color:#0e6b4c;box-shadow:0 0 0 3px #dff7eb}</style>
