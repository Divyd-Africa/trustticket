{% extends 'base.html' %}{% block title %}Verify your email · TicketTrust{% endblock %}{% block content %}<div class="max-w-md mx-auto px-5 py-20"><div class="bg-white border border-slate-200 rounded-3xl p-8 text-center"><span class="w-14 h-14 bg-mint text-green rounded-2xl grid place-items-center text-2xl mx-auto">✉</span><h1 class="display text-3xl font-bold mt-6">Check your inbox</h1><p class="text-slate-500 mt-3">We sent a 6-digit code to {{ email }}.</p><form method="post" class="mt-7">{% csrf_token %}<input required name="code" inputmode="numeric" maxlength="6" class="field text-center tracking-[.5em] text-xl" placeholder="000000"><button class="mt-4 w-full bg-ink text-white rounded-full py-3 font-bold">Verify email</button></form><form method="post" action="{% url 'resend_otp' %}" class="mt-4">{% csrf_token %}<button class="text-green text-sm font-bold hover:underline">Resend verification code</button></form><p class="text-xs text-slate-400 mt-5">Check spam or promotions if it does not appear within a minute.</p></div></div><style>.field{display:block;width:100%;border:1px solid #e2e8f0;border-radius:.9rem;padding:.75rem .9rem;outline:none}.field:focus{border-color:#0e6b4c}</style>{% endblock %}
