{% extends 'base.html' %}{% block title %}Log in · TicketTrust{% endblock %}{% block content %}<div class="max-w-md mx-auto px-5 py-20"><h1 class="display text-4xl font-bold">Welcome back.</h1><form method="post" class="bg-white border border-slate-200 rounded-3xl p-7 mt-8">{% csrf_token %}<label class="text-sm font-semibold">Email<input required type="email" name="email" class="field"></label><label class="block text-sm font-semibold mt-4">Password<input required type="password" name="password" class="field"></label><button class="mt-7 w-full bg-ink text-white rounded-full py-3 font-bold">Log in</button><p class="text-center text-sm text-slate-500 mt-5">New here? <a href="/register/" class="text-green font-semibold">Create an account</a></p></form></div><style>.field{display:block;width:100%;margin-top:.45rem;border:1px solid #e2e8f0;border-radius:.9rem;padding:.75rem .9rem;outline:none}</style>{% endblock %}
